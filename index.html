<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>三國誌版皇室戰爭 — POC v1.1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="brand">三國誌版皇室戰爭 <span class="tag">POC v1.1</span></div>
      <div class="match-meta">
        <span id="timer">3:00</span>
        <span id="phase" class="phase">前哨</span>
        <span id="crowns">👑 0 — 0</span>
      </div>
    </header>

    <main class="stage">
      <aside class="enemy-info">
        <div class="side-label enemy">敵方</div>
        <div class="resource-stack enemy-res">
          <div class="res-block junling" title="軍令：部署">
            <div class="res-label">軍令</div>
            <div class="res-track">
              <div id="ai-junling-fill" class="res-fill"></div>
              <span id="ai-junling-num" class="res-num">5</span>
            </div>
          </div>
          <div class="res-block shiqi" title="士氣：計略">
            <div class="res-label">士氣</div>
            <div class="res-orb-wrap">
              <div id="ai-shiqi-orb" class="shiqi-orb">
                <div id="ai-shiqi-ring" class="shiqi-ring"></div>
                <span id="ai-shiqi-num">0.0</span>
              </div>
              <div id="ai-shiqi-rate" class="shiqi-rate">蓄勢中</div>
            </div>
          </div>
        </div>
      </aside>

      <div class="arena-wrap">
        <canvas id="arena" width="420" height="640"></canvas>
        <div id="banner" class="banner hidden"></div>
        <div id="cast-flash" class="cast-flash hidden"></div>
        <div id="toast" class="toast hidden"></div>
      </div>

      <aside class="player-info">
        <div class="resource-stack player-res">
          <div class="res-block junling" title="軍令：部署節奏">
            <div class="res-label">軍令 <small>出兵</small></div>
            <div class="res-track">
              <div id="pl-junling-fill" class="res-fill"></div>
              <span id="pl-junling-num" class="res-num">5</span>
            </div>
            <div id="leak-warn" class="leak-warn hidden">軍令已滿！</div>
          </div>
          <div class="res-block shiqi" title="士氣：蓄勢喊招">
            <div class="res-label">士氣 <small>計略</small></div>
            <div class="res-orb-wrap">
              <div id="pl-shiqi-orb" class="shiqi-orb">
                <div id="pl-shiqi-ring" class="shiqi-ring"></div>
                <span id="pl-shiqi-num">0.5</span>
              </div>
              <div id="pl-shiqi-rate" class="shiqi-rate">+0.11/秒 · 蓄勢</div>
              <div id="shiqi-hint" class="shiqi-hint">點場上武將開計略</div>
            </div>
          </div>
        </div>
        <div class="side-label player">我方</div>
      </aside>
    </main>

    <footer class="hand-bar">
      <div id="hand" class="hand"></div>
      <p class="hint" id="hint">選牌 → 點左／右線部署｜點己方單位開計略</p>
    </footer>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h1>雙軌指揮</h1>
        <p>軍令出兵 · 士氣翻盤<br />點手牌選將，再點己方半場左右線部署。<br />點場上己方武將開計略（士氣足夠時）。</p>
        <button id="btn-start" type="button" data-action="start">開戰</button>
        <p class="start-hotkey">或按 Enter / 空白鍵</p>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
